<style>
:root{

*{box-sizing:border-box}
html{background:var(--clay);scrollbar-gutter:stable;-webkit-text-size-adjust:100%}

body{margin:0;background:var(--clay);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}

/* the studio */
#gl{position:fixed;inset:0;width:100%;height:100vh;height:100lvh;display:block;touch-action:pan-y;opacity:0;transition:opacity 1s ease}

/* corner furniture */
.ui{position:fixed;z-index:5;font-size:13px;color:var(--ink-2)}
.back{top:var(--pad);left:var(--pad);text-decoration:none;padding:6px 0}

.corner{top:var(--pad);right:var(--pad);display:flex;align-items:center;gap:18px}
.corner a{text-decoration:none;border-bottom:1px solid var(--rule);padding:4px 0 2px;color:var(--ink)}

.corner button{background:none;border:1px solid var(--rule);border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--ink);transition:border-color .2s,background .2s}
.corner button:hover{border-color:var(--ink);background:rgba(255,255,255,.25)}
.clock{left:var(--pad);bottom:var(--pad);pointer-events:none}
.clock b{display:block;font:400 clamp(58px,7.4vw,112px)/.86 var(--display);letter-spacing:-.01em;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.clock span{display:block;margin-top:12px;max-width:34ch;line-height:1.45;transition:opacity .8s}
.clock span.dim{opacity:.55}
.ruler{right:var(--pad);top:22vh;bottom:22vh;width:54px;pointer-events:auto}
.ruler button{position:absolute;right:18px;transform:translateY(-50%);border:0;background:none;padding:3px 0;font:500 10.5px/1 var(--sans);letter-spacing:.04em;color:var(--ink-3);cursor:pointer;font-variant-numeric:tabular-nums}
.ruler button::after{content:'';position:absolute;right:-18px;top:50%;width:9px;height:1px;background:currentColor;opacity:.7}
.ruler button:hover{color:var(--ink)}
.ruler .now{position:absolute;right:0;width:16px;height:2px;margin-top:-1px;background:var(--ink);transition:top .12s linear}
.ruler button.on{color:var(--ink)}

.tag{position:fixed;left:0;top:0;z-index:4;pointer-events:none;max-width:250px;padding:7px 10px 8px;background:var(--paper);border:1px solid rgba(42,36,32,.2);border-radius:2px;

.tag small{display:block;font:600 10px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

[

const RANK = { name: 0, degree: 1, role: 2, paper: 3, award: 4, cert: 5, more: 6, email: 7 };
ITEMS.sort((a, b) => a.y - b.y || RANK[a.kind] - RANK[b.kind]);
const YEARS = Array.from({ length: 12 }, (_, i) => 2015 + i);
YEARS.forEach(y => {
  const L = ITEMS.filter(o => o.y === y);

ITEMS.forEach((o, i) => { o.i = i; o.state = 'wait' });
const LABEL = { name: 'Name', role: 'Role', degree: 'Degree', paper: 'Paper', award: 'Award', cert: 'Certificate', more: 'The rest', email: 'Email' };

const $ = s => document.querySelector(s), root = document.documentElement;

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

$('#things').innerHTML = ITEMS.map(o => `<li><button type="button" data-i="${o.i}">${o.y}, ${LABEL[o.kind].toLowerCase()}: ${esc(o.title)}${o.kind === 'paper' ? `, ${cites(o.cites)}` : ''}${o.kind === 'role' ? `, ${esc(o.org)}` : ''}. Press Enter to bring it forward.</button></li>`).join('');

function textVersion(note) {
  const byYear = YEARS.map(y => {
    const L = ITEMS.filter(o => o.y === y && o.kind !== 'name' && o.kind !== 'email' && o.kind !== 'more');
    const li = L.map(o => {
      const k = LABEL[o.kind];
      if (o.kind === 'paper') return `<li><span>${k} · ${cites(o.cites)}</span><a href="${o.link}" rel="noopener">${esc(o.title)}</a><p>${esc(o.authors)}${o.org ? `. <i>${esc(o.org)}</i>` : ''}.</p></li>`;
      if (o.kind === 'role') return `<li><span>${k} · ${esc(o.when)}</span>${esc(o.title)}, ${esc(o.org)}<p>${esc(o.note)}</p></li>`;
      const scan = o.file ? ` <a href="${IMG + o.file}" rel="noopener">Scan</a>` : '';
      return `<li><span>${k} · ${esc(o.when)}</span>${esc(o.title)}${o.org ? `, ${esc(o.org)}` : ''}.${scan}${o.note ? `<p>${esc(o.note)}</p>` : ''}</li>`;
    }).join('');
    return `<h2>${y}</h2>${li ? `<ul>${li}</ul>` : '<p class="quiet">Nothing landed this year.</p>'}`;
  }).join('');
  const rest = REST.map(([f, t, org, d]) => `<a href="${IMG + f}" rel="noopener">${esc(t)}</a> (${esc(org)}, ${d})`).join('; ');
  return `<h1 id="t-h">George Michoulis</h1>
  <p class="lede">Everything in the pile, oldest first. George lives in Thessaloniki. Since May 2026 he has built Web3 products at Cyberscope by TAC; before that he worked on EU blockchain projects, taught networks and web development, and published on credential verification, DAO governance and 5G marketplaces.</p>
  ${note ? `<p class="note">${note}</p>` : ''}
  <h2>2015</h2><ul><li><span>Start</span>Began the BSc in Applied Informatics at the University of Macedonia.</li>${ITEMS.filter(o => o.y === 2015 && o.kind !== 'name').map(o => `<li><span>${LABEL[o.kind]} · ${esc(o.when)}</span>${esc(o.title)}, ${esc(o.org)}. ${o.file ? `<a href="${IMG + o.file}" rel="noopener">Scan</a>` : ''}${o.note ? `<p>${esc(o.note)}</p>` : ''}</li>`).join('')}</ul>
  ${byYear.slice(byYear.indexOf('<h2>2016'))}
  <h2>Also</h2><p>${rest}.</p>
  <p>Also on <a href="${SCHOLAR}" rel="noopener">Google Scholar</a>: a gender-equality observatory paper (2022) and two Greek-language papers on verifying academic titles with Ethereum (2020 and 2021).</p>
  <p class="end">Email <a href="mailto:gmixoulis@gmail.com">gmixoulis@gmail.com</a>. He is also on <a href="https://www.linkedin.com/in/george-michoulis/" rel="noopener">LinkedIn</a>, <a href="https://github.com/gmixoulis" rel="noopener">GitHub</a> and <a href="https://twitter.com/GeorgeMicou" rel="noopener">X</a>.</p>`;
}
$('#text').innerHTML = textVersion();

/* scroll is time: each year gets scroll length in proportion to how much landed in it */
const W = YEARS.map(y => .5 + .12 * ITEMS.filter(o => o.y === y).length);
const CUM = W.reduce((a, w) => (a.push(a[a.length - 1] + w), a), [0]);
const TOTAL = CUM[CUM.length - 1], TAIL = .55;
let vh = innerHeight;
const sizeTime = () => { vh = innerHeight; $('#time').style.height = reduced ? '0px' : `${(TOTAL + TAIL) * vh + vh}px` };
const timeAt = sc => { const s = sc / vh; for (let i = 0; i < 12; i++) if (s < CUM[i + 1]) return 2015 + i + (s - CUM[i]) / W[i]; return 2027 };
const scrollFor = t => { const i = Math.max(0, Math.min(11, Math.floor(t - 2015))); return (CUM[i] + (t - 2015 - i) * W[i]) * vh };
sizeTime();
$('#ruler').insertAdjacentHTML('beforeend', YEARS.map((y, i) => `<button type="button" tabindex="-1" data-y="${y}" style="top:${CUM[i] / TOTAL * 100}%">${y}</button>`).join(''));
$('#ruler').addEventListener('click', e => { const b = e.target.closest('button'); if (b) scrollTo({ top: scrollFor(+b.dataset.y + .12), behavior: reduced ? 'auto' : 'smooth' }) });

/* reading mode */
let savedY = 0;
const setReading = (on, fromUser = true) => {
  if (on === root.classList.contains('reading') && fromUser) return;
  if (on) { savedY = scrollY; root.classList.add('reading'); scrollTo(0, 0); if (fromUser) $('#t-h').setAttribute('tabindex', '-1'), $('#t-h').focus() }
  else { root.classList.remove('reading'); scrollTo(0, savedY) }
  $('#textBtn').textContent = on ? 'Back to the pile' : 'Read as text';
  $('#textBtn').setAttribute('aria-pressed', on);
  if (fromUser) history.replaceState(null, '', on ? '#text' : location.pathname);
  window.dispatchEvent(new Event('readingchange'));
};
$('#textBtn').onclick = () => setReading(!root.classList.contains('reading'));
if (root.classList.contains('reading')) setReading(true, false);

const noGL = why => {
  root.classList.add('no-gl');
  $('#text').innerHTML = textVersion(`This page normally drops each of these into a 3D studio, but ${why}. Here is the same record as text.`);
  root.classList.add('reading');
};

/* ---------------------------------------------------------------------------------------------
   The studio
--------------------------------------------------------------------------------------------- */
history.scrollRestoration = 'manual';
scrollTo(0, 0);
const cv = $('#gl');
try {
  const probe = document.createElement('canvas');
  if (!probe.getContext('webgl2') && !probe.getContext('webgl')) throw new Error('your browser has WebGL switched off');
  const A = 'three/addons/';
  const [THREE, CANNON, { RoundedBoxGeometry }, { RoomEnvironment }, { EffectComposer }, { RenderPass }, { GTAOPass }, { OutputPass }] = await Promise.all([
    import('three'), import('cannon-es'), import(A + 'geometries/RoundedBoxGeometry.js'), import(A + 'environments/RoomEnvironment.js'),
    import(A + 'postprocessing/EffectComposer.js'), import(A + 'postprocessing/RenderPass.js'), import(A + 'postprocessing/GTAOPass.js'), import(A + 'postprocessing/OutputPass.js')]);
  await Promise.race([
    Promise.all(['400 40px "Libre Caslon Text"', '700 40px "Libre Caslon Text"', 'italic 400 40px "Libre Caslon Text"', '400 40px "Libre Caslon Display"', '600 20px "Hanken Grotesk"', '500 20px "Hanken Grotesk"'].map(f => document.fonts.load(f))),
    new Promise(r => setTimeout(r, 2500))]);
  studio(THREE, CANNON, RoundedBoxGeometry, RoomEnvironment, { EffectComposer, RenderPass, GTAOPass, OutputPass });
} catch (e) { console.warn('Gravity fallback:', e); noGL(e.message && e.message.startsWith('your') ? e.message : 'the 3D libraries could not load') }

function studio(THREE, CANNON, RoundedBoxGeometry, RoomEnvironment, PP) {
  const mob = innerWidth < 700 || touch;
  const VW = () => cv.clientWidth || innerWidth, VH = () => cv.clientHeight || innerHeight;
  /* Soft shadows that harden where things touch (percentage-closer soft shadows) for an orthographic

  if (!mob) {
    const FR = 24, DEPTH = 38, SIZE = .07; // shadow frustum width, depth range, light's angular size (a big softbox)
    const pcss = `
      #define PS 16
      vec2 pDisk[PS];
      void pInit(vec2 seed){ float a = rand(seed) * PI2, r = 1. / float(PS);
        for (int i = 0; i < PS; i++) { pDisk[i] = vec2(cos(a), sin(a)) * pow(r, .75); r += 1. / float(PS); a += PI2 * 7. / float(PS); } }
      float PCSS(sampler2D sm, vec4 c){

        float s = 0.;
        for (int i = 0; i < PS; i++) { s += step(zr, unpackRGBAToDepth(texture2D(sm, uv + pDisk[i] * pen))); s += step(zr, unpackRGBAToDepth(texture2D(sm, uv - pDisk[i].yx * pen))); }

    THREE.ShaderChunk.shadowmap_pars_fragment = ch;
  }
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
  let dpr = Math.min(devicePixelRatio || 1, 1.5);

  renderer.shadowMap.enabled = true;

  const scene = new THREE.Scene();

  scene.environmentIntensity = .3;

  const cam = new THREE.PerspectiveCamera(30, VW() / VH(), .1, 140);

  /* light: one strong key from the upper left, a soft sky fill, a faint cool kicker for edges */
  scene.add(new THREE.HemisphereLight('#f4f2ee', '#766a60', .95));
  const key = new THREE.DirectionalLight('#fff7ee', 3.3);

  key.castShadow = true;
  key.shadow.mapSize.set(mob ? 1024 : 2048, mob ? 1024 : 2048);
  Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 2, far: 40 });
  key.shadow.bias = -.0005; key.shadow.normalBias = .03;
  scene.add(key, key.target);
  const kick = new THREE.DirectionalLight('#e3eaf3', .5); kick.position.set(8, 5, -7); scene.add(kick);

  /* the sweep: a clay floor that curves up into a back wall, like a photo studio cyc */
  {
    const prof = [[46, 0], [-4, 0]], R = 3.4;
    for (let i = 1; i <= 18; i++) { const a = i / 18 * Math.PI / 2; prof.push([-4 - Math.sin(a) * R, R - Math.cos(a) * R]) }
    prof.push([-4 - R, 34]);
    const strip = P => { // extrude a (z, y) profile across x
      const pos = [], uv = [], idx = []; let d = 0;
      P.forEach((p, i) => { if (i) d += Math.hypot(p[0] - P[i - 1][0], p[1] - P[i - 1][1]); pos.push(-70, p[1], p[0], 70, p[1], p[0]); uv.push(0, d / 12, 12, d / 12) });
      for (let i = 0; i < P.length - 1; i++) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2) }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
      return g;
    };
    // a whisper of grain so the clay doesn't read as flat CG colour
    const nc = document.createElement('canvas'); nc.width = nc.height = 256; const nx = nc.getContext('2d'), id = nx.createImageData(256, 256);
    for (let i = 0; i < id.data.length; i += 4) { const v = 240 + Math.random() * 15; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
    nx.putImageData(id, 0, 0);
    const nt = new THREE.CanvasTexture(nc); nt.wrapS = nt.wrapT = THREE.RepeatWrapping; nt.repeat.set(3, 3); nt.colorSpace = THREE.SRGBColorSpace;
    const sm = new THREE.MeshStandardMaterial({ color: '#b9a898', roughness: .95, metalness: 0, map: nt, dithering: true });
    // the pool of the key light on the clay, falling off toward the edges and up the sweep
    sm.onBeforeCompile = s => {
      s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWp;').replace('#include <project_vertex>', '#include <project_vertex>\nvWp = (modelMatrix * vec4(transformed, 1.)).xyz;');
      s.fragmentShader = s.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vWp;').replace('#include <map_fragment>', `#include <map_fragment>
        vec2 pc = vWp.xz - vec2(-.8, .6);
        diffuseColor.rgb *= mix(.6, 1.05, exp(-dot(pc, pc * vec2(1., 1.6)) / 70.)) * mix(1., .72, smoothstep(0., 10., vWp.y));`);
    };

    const floor = new THREE.Mesh(strip(prof.slice(0, 2)), sm), cove = new THREE.Mesh(strip(prof.slice(1)), sm);
    floor.receiveShadow = true; scene.add(floor, cove);
  }

  /* physics world */
  const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -24, 0), allowSleep: true });
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.solver.iterations = 12; world.solver.tolerance = 1e-4;
  const mSolid = new CANNON.Material('solid'), mPaper = new CANNON.Material('paper'), mFloor = new CANNON.Material('floor');
  world.defaultContactMaterial.friction = .5; world.defaultContactMaterial.restitution = .08;
  world.defaultContactMaterial.contactEquationStiffness = 1e8; world.defaultContactMaterial.contactEquationRelaxation = 3;

  const wall = (pos, axis, ang, mat = mFloor) => { const b = new CANNON.Body({ mass: 0, material: mat }); b.addShape(new CANNON.Plane()); b.position.set(...pos); b.quaternion.setFromAxisAngle(new CANNON.Vec3(...axis), ang); world.addBody(b) };
  wall([0, 0, 0], [1, 0, 0], -Math.PI / 2);            // floor
  wall([0, 0, -4], [0, 1, 0], 0);                       // back (where the sweep starts to curve)
  wall([0, 0, 5.6], [0, 1, 0], Math.PI);                // invisible front and sides, kept out of frame
  wall([-8.4, 0, 0], [0, 1, 0], Math.PI / 2);
  wall([8.4, 0, 0], [0, 1, 0], -Math.PI / 2);

  /* ------------------------------------------------------------------ typesetting on objects */
  const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c };
  const tex = c => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO; return t };
  const lines = (g, text, maxW) => { const out = []; let cur = ''; for (const w of text.split(' ')) { const n = cur ? cur + ' ' + w : w; if (g.measureText(n).width > maxW && cur) { out.push(cur); cur = w } else cur = n } if (cur) out.push(cur); return out };
  const fit = (g, text, font, size, maxW, maxL, min = 12) => { for (; size >= min; size -= 2) { g.font = font(size); const L = lines(g, text, maxW); if (L.length <= maxL) return { size, L } } g.font = font(min); return { size: min, L: lines(g, text, maxW).slice(0, maxL) } };
  const caps = (g, text, x, y, size, color, track = .12, weight = 600) => { g.font = `${weight} ${size}px "Hanken Grotesk"`; g.fillStyle = color; if ('letterSpacing' in g) { g.letterSpacing = `${size * track}px`; g.fillText(text.toUpperCase(), x, y); g.letterSpacing = '0px' } else g.fillText(text.toUpperCase(), x, y) };
  const serif = s => `400 ${s}px "Libre Caslon Text"`, serifB = s => `700 ${s}px "Libre Caslon Text"`, serifI = s => `italic 400 ${s}px "Libre Caslon Text"`, disp = s => `400 ${s}px "Libre Caslon Display"`;
  const grain = (g, w, h, a = .035) => { const d = g.getImageData(0, 0, w, h); for (let i = 0; i < d.data.length; i += 4) { const n = (Math.random() - .5) * 255 * a; d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n } g.putImageData(d, 0, 0) };
  const light = hex => { const c = new THREE.Color(hex); return c.r * .3 + c.g * .59 + c.b * .11 > .45 };

  function faceRole(o, W, H, top) {
    const c = mkCanvas(W, H), g = c.getContext('2d'), ink = light(o.color) ? '#2a2420' : '#f4ede2', sub = light(o.color) ? 'rgba(42,36,32,.62)' : 'rgba(244,237,226,.74)';
    g.fillStyle = o.color; g.fillRect(0, 0, W, H); grain(g, W, H, .025);
    const m = W * .045, cs = W * .02, row = m + cs;
    caps(g, o.org, m, row, cs, sub, .12);
    g.textAlign = 'right'; g.font = serifI(cs * 1.35); g.fillStyle = sub; g.fillText(o.when, W - m, row); g.textAlign = 'left';
    let foot = H - m * .9;
    if (top) {
      const b = fit(g, o.note, serif, W * .026, W - m * 2, 2, 14); g.font = serif(b.size); g.fillStyle = sub;
      b.L.forEach((l, i) => g.fillText(l, m, foot - (b.L.length - 1 - i) * b.size * 1.35));
      foot -= b.L.length * b.size * 1.35 + cs * .6;
    }

    else { g.textAlign = 'right'; caps(g, 'Thessaloniki', W - m, y - s * .02, H * .1, 'rgba(239,230,214,.56)', .18); g.textAlign = 'left' }
    return c;
  }

    const { m, s, y } = nameSet(g, W, H, top);

    return c;
  }
  function facePaper(o, W, H) {
    const c = mkCanvas(W, H), g = c.getContext('2d');
    g.fillStyle = COL.paper; g.fillRect(0, 0, W, H); grain(g, W, H, .03);
    const m = W * .1;
    caps(g, `Paper · ${o.y}`, m, m + 14, 20, '#7b6b5e');
    g.fillStyle = '#2a2420'; g.fillRect(m, m + 34, W - m * 2, 2);
    const f = fit(g, o.title, serif, 58, W - m * 2, 6, 30);
    g.font = serif(f.size); g.fillStyle = '#231e1a';
    let y = m + 50 + f.size;
    f.L.forEach(l => { g.fillText(l, m, y); y += f.size * 1.18 });
    y += 12;
    const a = fit(g, o.authors, serif, 24, W - m * 2, 3, 16); g.font = serif(a.size); g.fillStyle = '#5a4d43'; a.L.forEach(l => { y += a.size * 1.35; g.fillText(l, m, y) });

    camS.y += (g.y - camS.y) * k; camS.d += (g.d - camS.d) * k;
    camT.set(0, camS.y, .2);
    cam.position.set(camT.x + Math.sin(YAW) * Math.cos(ELEV) * camS.d, camT.y + Math.sin(ELEV) * camS.d, camT.z + Math.cos(YAW) * Math.cos(ELEV) * camS.d);
    cam.lookAt(camT);
    const w = VW(), h = VH(); if (w > 700) cam.setViewOffset(w, h, -w * .045, h * .03, w, h); else cam.clearViewOffset();
    return Math.abs(g.d - camS.d) + Math.abs(g.y - camS.y) > .01;
  }

  /* ------------------------------------------------------------------ pointer: hover tags, drag to throw, double-click to read */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tagEl = $('#tag');
  const pickAt = (x, y) => {
    ndc.set(x / VW() * 2 - 1, -(y / VH()) * 2 + 1); ray.setFromCamera(ndc, cam);
    const hits = ray.intersectObjects(ITEMS.filter(o => o.mesh && o.mesh.visible && (o.state === 'live' || o.state === 'front')).map(o => o.mesh), true);
    const h = hits.find(h => h.object.item);
    return h ? { o: h.object.item, p: h.point } : null;
  };
  let hover = null, kbd = null, pinned = null;
  const drag = { o: null, joint: null, c: null, plane: new THREE.Plane(), moved: 0, x: 0, y: 0 };
  const jointBody = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC }); jointBody.collisionFilterGroup = 0; jointBody.collisionFilterMask = 0; world.addBody(jointBody);

  function grab(hit, x, y) {
    const o = hit.o, b = o.body;
    if (o.kind === 'name') return; // the base of everything stays put
    drag.o = o; drag.moved = 0; drag.x = x; drag.y = y;
    drag.plane.setFromNormalAndCoplanarPoint(cam.getWorldDirection(new THREE.Vector3()).negate(), hit.p);
    jointBody.position.set(hit.p.x, hit.p.y, hit.p.z);
    const piv = b.pointToLocalFrame(new CANNON.Vec3(hit.p.x, hit.p.y, hit.p.z));
    drag.c = new CANNON.PointToPointConstraint(b, piv, jointBody, new CANNON.Vec3(), o.mass * 24 * 1.25 + 90);
    world.addConstraint(drag.c);
    b.wakeUp(); b.angularDamping = .7; b.allowSleep = false;
    cv.classList.add('grabbing');
  }
  function release() {
    if (!drag.o) return;
    const b = drag.o.body; b.angularDamping = drag.o.flutter ? .45 : .12; b.allowSleep = true;
    world.removeConstraint(drag.c); drag.o = null; drag.c = null; cv.classList.remove('grabbing');
  }
  const hitPt = new THREE.Vector3();
  function moveJoint(x, y) {
    ndc.set(x / VW() * 2 - 1, -(y / VH()) * 2 + 1); ray.setFromCamera(ndc, cam);
    if (ray.ray.intersectPlane(drag.plane, hitPt)) { hitPt.y = Math.max(hitPt.y, .15); hitPt.z = Math.max(-3.6, Math.min(4.2, hitPt.z)); jointBody.position.set(hitPt.x, hitPt.y, hitPt.z) }
  }

  // Touch: a swipe always scrolls time. Press and hold on something (without moving) to pick it up;
  // from then on the finger drags it and the page stays put.
  let hold = null;
  cv.addEventListener('touchstart', e => {
    clearTimeout(hold && hold.timer); hold = null;
    if (front || reduced || e.touches.length !== 1) return;
    const t = e.touches[0], hit = pickAt(t.clientX, t.clientY); if (!hit || hit.o.kind === 'name') return;
    hold = { x: t.clientX, y: t.clientY, timer: setTimeout(() => { if (hold) { grab(pickAt(hold.x, hold.y) || hit, hold.x, hold.y); navigator.vibrate && navigator.vibrate(8) } }, 230) };
  }, { passive: true });
  cv.addEventListener('touchmove', e => {
    if (drag.o) { e.preventDefault(); const t = e.touches[0]; moveJoint(t.clientX, t.clientY); dirty = 1; return }
    if (hold) { const t = e.touches[0]; if (Math.hypot(t.clientX - hold.x, t.clientY - hold.y) > 8) { clearTimeout(hold.timer); hold = null } }
  }, { passive: false });
  cv.addEventListener('touchend', () => { if (hold) clearTimeout(hold.timer); hold = null; release(); dirty = 1 });
  let lastTap = { t: 0, o: null };
  cv.addEventListener('pointerdown', e => {
    if (front && !e.button) { dropBack(); return }
    if (e.button) return;
    const hit = pickAt(e.clientX, e.clientY); if (!hit) { pinned = null; dirty = 1; return }
    firstTouch();
    if (e.pointerType !== 'mouse') { const now = performance.now(); if (lastTap.o === hit.o && now - lastTap.t < 320) { lastTap.o = null; clearTimeout(hold && hold.timer); hold = null; bringForward(hit.o); return } lastTap = { t: now, o: hit.o }; pinned = hit.o; dirty = 1; return }
    if (reduced) return;
    cv.setPointerCapture(e.pointerId);
    grab(hit, e.clientX, e.clientY);
  });
  cv.addEventListener('pointermove', e => {
    if (drag.o) { moveJoint(e.clientX, e.clientY); if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) drag.moved = 1; dirty = 1; return }
    if (e.pointerType !== 'mouse' || front) return;
    const hit = pickAt(e.clientX, e.clientY);
    hover = hit ? hit.o : null;
    cv.classList.toggle('grab', !!hover && !reduced && hover.kind !== 'name');
    cv.style.cursor = hover && (reduced || hover.kind === 'name') ? 'pointer' : '';
    dirty = 1;
  });
  const up = () => { release(); dirty = 1 };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { hover = null; cv.classList.remove('grab'); dirty = 1 });
  cv.addEventListener('dblclick', e => { const hit = pickAt(e.clientX, e.clientY); if (hit) bringForward(hit.o) });

  /* ------------------------------------------------------------------ bring forward, drop back */
  let front = null;
  const dim = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshBasicMaterial({ color: '#d9c4b3', transparent: true, opacity: 0, depthWrite: false, fog: false }));
  dim.renderOrder = 10; cam.add(dim); dim.visible = false;
  const capEl = $('#cap');
  const qBase = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);
  function frontPose(o) {
    const aspect = VW() / VH(), tanV = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
    const [fw, fh] = o.face, capH = Math.min(.42, (capEl.offsetHeight + 40) / VH());
    const room = 1 - capH - .12;
    const dist = Math.max(fw / (2 * tanV * aspect * (VW() < 700 ? .88 : .6)), fh / (2 * tanV * room)) + o.h / 2;
    // held close to the lens at reduced scale (same size on screen), so the dimmer can sit in front of the whole studio
    const near = Math.min(dist, 2.6), sc = near / dist, lift = (capH - .02) * tanV * near;
    const p = new THREE.Vector3(0, lift, -near).applyMatrix4(cam.matrixWorld);
    const q = cam.quaternion.clone().multiply(o.tent ? new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), o.tent) : qBase);
    dim.position.set(0, 0, -near - Math.max(o.h, o.d || 0) * sc - .3);
    return { p, q, s: sc };
  }
  function bringForward(o) {
    if (front === o) return;
    if (front) dropBack(true);
    firstTouch();
    returnTo = document.activeElement;
    if (o.kind === 'name') {
      // the name holds the whole pile up, so a copy comes forward and the block itself stays put
      const px = Object.create(o); px.proxy = o; px.mesh = o.mesh.clone(); px.mesh.traverse(m => { m.castShadow = false; m.item = o });
      scene.add(px.mesh); o.mesh.visible = false; o = px;
    } else {
      if (o.state === 'front-drop') anims.delete(o);
      else if (o.state !== 'live') { measurePile(); const s = spawnPose(o); if (!o.mesh) build(o); if (o.state === 'lift') anims.delete(o); o.mesh.position.copy(s.p); o.mesh.quaternion.copy(s.q); o.mesh.visible = true; const qi = queue.indexOf(o); if (qi > -1) queue.splice(qi, 1) }
      unworld(o); release(); cast(o, false); hiRes(o);
    }
    front = o; o.state = 'front';
    root.classList.add('lock', 'front');
    fillCaption(o);
    capEl.hidden = false; requestAnimationFrame(() => capEl.classList.add('on'));
    dim.visible = true;
    const fp = frontPose(o);
    tween(o, fp.p, fp.q, reduced ? 0 : 750, 'io', null, fp.s);
    fadeDim(.78);
    (returnTo && returnTo.closest && returnTo.closest('#things') ? $('#cap-x') : capEl).focus({ preventScroll: true });
  }
  function dropBack(quick) {
    const o = front; if (!o) return;
    front = null;
    root.classList.remove('lock', 'front');
    capEl.classList.remove('on'); setTimeout(() => { if (!front) capEl.hidden = true }, 300);
    fadeDim(0);
    if (o.proxy) { tween(o, () => o.proxy.mesh.position, () => o.proxy.mesh.quaternion, quick || reduced ? 1 : 480, 'io', () => { scene.remove(o.mesh); o.proxy.mesh.visible = true }); restoreFocus(); return }
    if (reduced) { o.mesh.position.copy(o.rest.p); o.mesh.quaternion.copy(o.rest.q); o.mesh.scale.setScalar(1); o.state = 'live'; cast(o, true); restoreFocus(o); return }
    measurePile();
    const s = spawnPose(o, -.6);
    tween(o, s.p, s.q, quick ? 1 : 420, 'out', () => { if (o.state === 'front-drop') { place(o, o.mesh.position.clone(), o.mesh.quaternion.clone(), -2) } });
    o.state = 'front-drop';
    restoreFocus(o);
  }
  let returnTo = null;
  const restoreFocus = () => { const el = returnTo; returnTo = null; if (el && el.closest && el.closest('#things')) requestAnimationFrame(() => el.focus({ preventScroll: true })) };
  let dimGoal = 0;
  const fadeDim = v => { dimGoal = v; dim.visible = true };
  $('#cap-x').onclick = () => dropBack();
  addEventListener('keydown', e => { if (e.key === 'Escape' && front) { e.preventDefault(); dropBack() } });
  function fillCaption(o) {
    $('#cap-k').textContent = `${LABEL[o.kind]} · ${o.kind === 'paper' ? `${o.y} · ${cites(o.cites)}` : o.when}`;
    $('#cap-h').textContent = o.title;
    let b = '', r = '';
    if (o.kind === 'paper') { b = `<p>${esc(o.authors)}${o.org ? `. <i>${esc(o.org)}</i>` : ''}.</p>`; r = `<a href="${o.link}" target="_blank" rel="noopener">On Google Scholar ↗</a>` }
    else if (o.kind === 'role') b = `<p>${esc(o.org)}. ${esc(o.note)}</p>`;
    else if (o.kind === 'more') { b = `<ul>${o.rest.map(([f, t, org, d]) => `<li><a href="${IMG + f}" target="_blank" rel="noopener">${esc(t)}</a>, ${d}</li>`).join('')}</ul>` }
    else if (o.kind === 'email') { b = `<p>The last thing to land, in 2026. Also on <a href="https://www.linkedin.com/in/george-michoulis/" target="_blank" rel="noopener">LinkedIn</a>, <a href="https://github.com/gmixoulis" target="_blank" rel="noopener">GitHub</a> and <a href="${SCHOLAR}" target="_blank" rel="noopener">Google Scholar</a>.</p>`; r = `<a href="mailto:gmixoulis@gmail.com">Email George ↗</a>` }
    else if (o.kind === 'name') b = `<p>${esc(o.note)} He lives in Thessaloniki.</p>`;
    else b = `<p>${esc(o.org)}.${o.note ? ' ' + esc(o.note) : ''}</p>`;
    if (o.file) r = `<a href="${IMG + o.file}" target="_blank" rel="noopener">Open the full scan ↗</a>`;
    $('#cap-b').innerHTML = b;
    $('#cap-r').querySelectorAll('a').forEach(a => a.remove());
    if (r) $('#cap-x').insertAdjacentHTML('beforebegin', r);
  }

  /* keyboard: the offscreen list. Focus walks time to that thing and tags it; Enter brings it forward */
  $('#things').addEventListener('focusin', e => {
    const o = ITEMS[+e.target.dataset.i]; if (!o) return;
    kbd = o; firstTouch();
    if (!reduced && o.state !== 'live' && o.state !== 'front' && T < o.t) scrollTo({ top: scrollFor(o.t) + 2, behavior: 'instant' });
    dirty = 1;
  });
  $('#things').addEventListener('focusout', () => { kbd = null; dirty = 1 });
  $('#things').addEventListener('click', e => { const b = e.target.closest('button'); if (b) bringForward(ITEMS[+b.dataset.i]) });

  /* the tag follows whatever is hovered, focused, or tapped */
  const tp = new THREE.Vector3();
  function placeTag() {
    const o = front ? null : (kbd || hover || pinned);
    if (!o || !o.mesh || !o.mesh.visible || o.state === 'lift') { tagEl.classList.remove('on', 'link'); return }
    const b = o.mesh.position; tp.set(b.x, b.y + Math.max(o.h, o.cyl ? o.r : .2) * .5 + .15, b.z).project(cam);
    if (tp.z > 1) { tagEl.classList.remove('on'); return }
    if (tagEl.dataset.i != o.i) {
      tagEl.dataset.i = o.i;
      tagEl.querySelector('small').textContent = `${LABEL[o.kind]} · ${tagLine(o)}`;
      const s = tagEl.querySelector('strong');
      if (o.kind === 'email') s.innerHTML = `<a href="mailto:gmixoulis@gmail.com">gmixoulis@gmail.com</a>`; else s.textContent = o.kind === 'role' ? `${o.title}, ${o.org}` : o.title;
      tagEl.classList.toggle('link', o.kind === 'email');
    }
    const x = (tp.x + 1) / 2 * VW(), y = (1 - tp.y) / 2 * VH() - 24;
    tagEl.style.transform = `translate(${Math.max(130, Math.min(VW() - 130, x))}px,${Math.max(80, y)}px) translate(-50%,-100%)`;
    tagEl.classList.add('on');
  }

  /* first interaction quietens the hint */
  let touched = 0;
  const firstTouch = () => { if (touched) return; touched = 1; $('#hint').classList.add('dim') };
  addEventListener('scroll', () => { if (scrollY > vh * .3) firstTouch(); dirty = 1 }, { passive: true });
  if (touch) $('#hint').textContent = 'Swipe up to move time forward. Hold anything to pick it up, double-tap to read it.';

  /* ------------------------------------------------------------------ loop */
  let dirty = 1, last = performance.now(), raf = 0, idle = 0, running = false;
  const stats = { phys: 0, draw: 0, n: 0 };
  let moved = true; // something changed pose outside physics (spawn, lift, drop-back)
  const sync = () => { for (const o of ITEMS) if (o.state === 'live') { o.mesh.position.copy(o.body.position); o.mesh.quaternion.copy(o.body.quaternion) } };
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    updateTime(now);
    const t0 = performance.now();
    if (!reduced) { world.step(1 / 60, dt, 2); sync() }
    const t1 = performance.now();
    stepAnims(now);
    measurePile();
    const camMoving = placeCam(dt);
    if (front && anims.has(front) === false) { const fp = frontPose(front); front.mesh.position.lerp(fp.p, .25); front.mesh.quaternion.slerp(fp.q, .25); front.mesh.scale.setScalar(fp.s) }
    dim.material.opacity += (dimGoal - dim.material.opacity) * (1 - Math.exp(-dt * 8)); if (dimGoal === 0 && dim.material.opacity < .01) dim.visible = false;
    placeTag();
    const busy = world.hasActiveBodies || anims.size || camMoving || queue.length || dirty || dim.visible || front;
    renderer.shadowMap.needsUpdate = world.hasActiveBodies || anims.size > 0 || moved;
    moved = false;
    if (busy) { idle = 0; draw(); watch(now, dt * 1000) } else if (idle++ < 2) draw();
    stats.phys += t1 - t0; stats.draw += performance.now() - t1; stats.n++;
    dirty = 0;
  }
  const start = () => { if (running) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame) };
  const stop = () => { running = false; cancelAnimationFrame(raf) };
  const pauseIfHidden = () => (document.hidden || root.classList.contains('reading')) ? stop() : (start(), dirty = 1);
  document.addEventListener('visibilitychange', pauseIfHidden);
  addEventListener('readingchange', pauseIfHidden);
  function resize() { renderer.setSize(VW(), VH(), false); composer && composer.setSize(VW(), VH()); cam.aspect = VW() / VH(); cam.updateProjectionMatrix(); dirty = 1 }
  addEventListener('resize', () => {
    resize();
    if (Math.abs(innerHeight - vh) > 120 || !touch) { const k = scrollY / vh; sizeTime(); if (!reduced) scrollTo(0, k * vh) }
    placeCam(0, true); dirty = 1;
  });

  /* reduced motion: settle the whole pile off-screen, in small slices, then show it still */
  if (reduced) {
    $('#hint').textContent = 'Reduced motion is on, so here is the pile already settled. Double-click anything to read it.';
    let k = 0, steps = 0;
    const settle = () => {
      const t0 = performance.now();
      while (performance.now() - t0 < 24) {
        if (k < ITEMS.length && steps % 20 === 0) { const o = ITEMS[k++]; measurePile(); const s = spawnPose(o); place(o, s.p, s.q) }
        world.step(1 / 60); steps++;
        if (k >= ITEMS.length && (!world.hasActiveBodies || steps > ITEMS.length * 20 + 900)) {
          sync(); ITEMS.forEach(o => { o.rest = { p: o.mesh.position.clone(), q: o.mesh.quaternion.clone() }; o.body.world && world.removeBody(o.body) });
          measurePile(); placeCam(0, true); updateTime(0); cv.classList.add('on'); pauseIfHidden(); return;
        }
      }
      requestAnimationFrame(settle);
    };
    ITEMS.forEach(build); ITEMS.forEach(o => loadScan(o));
    settle();
  } else {
    placeCam(0, true);
    requestAnimationFrame(() => cv.classList.add('on'));
    pauseIfHidden();
  }
  window.__gravity = { stats, renderer, pick: pickAt, ITEMS, world, get T() { return T }, get pileTop() { return pileTop }, bringForward, dropBack, cam, scrollFor };
}
</script>
</body>
</html>
