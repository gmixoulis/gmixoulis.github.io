name: Update Publications

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure axios is installed (used by fetch script)
        run: bun add axios

      - name: Run fetch script
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_MAX_RETRIES: '6'
          SERPAPI_TIMEOUT_MS: '60000'
        run: node scripts/fetchPublications.js

      - name: Commit publications.json update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f public/publications.json ] && git add public/publications.json || true
          git diff --cached --quiet || git commit -m "📚 Auto-update publications"
          git push || echo "Nothing to push"

      # Pages deployment is handled by deploy.yml on every push to master.
