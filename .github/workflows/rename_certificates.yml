name: Auto Rename Certificates

on:
  push:
    paths:
      - 'public/img/certificates/**'
      - 'scripts/rename_auto.js'
      - '.github/workflows/rename_certificates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🧶 Ensure @google/genai is installed (recent version with httpOptions)
        run: bun add @google/genai --ignore-scripts

      - name: 🧶 Ensure ollama SDK is installed (used as a free local fallback)
        run: bun add ollama --ignore-scripts

      - name: 🦙 Detect Ollama backend (cloud vs local)
        id: ollama_backend
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [ -n "$OLLAMA_API_KEY" ]; then
            echo "mode=cloud" >> "$GITHUB_OUTPUT"
            echo "Using Ollama Cloud (https://ollama.com)."
          else
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "No Ollama Cloud key -> will run a local Ollama server."
          fi

      - name: 🦙 Set up local Ollama (free, no key needed)
        # Only when NOT using Ollama Cloud. continue-on-error so a failed
        # install/pull just skips the Ollama stage in the script (it falls
        # back to DeepSeek automatically). Disable Ollama entirely with the
        # repo variable OLLAMA_ENABLED=false.
        if: ${{ steps.ollama_backend.outputs.mode == 'local' && vars.OLLAMA_ENABLED != 'false' }}
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 3
          ollama pull "${{ vars.OLLAMA_MODEL || 'qwen3:1.7b' }}"

      - name: 🔐 Run rename script (Gemini -> Ollama -> DeepSeek -> heuristic)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Primary vision model (image-capable, cheapest/fastest).
          GEMINI_MODEL: 'gemini-2.5-flash-lite'
          GEMINI_CONCURRENCY: '3'
          # Per-image cascade: each model is retried this many times before
          # falling through to the next (Google -> Ollama -> DeepSeek -> heuristic).
          GEMINI_MAX_RETRIES: '10'
          GEMINI_TIMEOUT_MS: '90000'
          # Ollama retry budget (per image).
          OLLAMA_MAX_RETRIES: '10'
          # DeepSeek = final API fallback (per-image retries).
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: 'deepseek-v4-flash'  # cheapest; thinking disabled in script
          DEEPSEEK_MAX_RETRIES: '10'
          # Ollama fallback (tried before DeepSeek). If OLLAMA_API_KEY is set the
          # script uses Ollama Cloud (https://ollama.com, model gemma3:4b);
          # otherwise it uses the local server bootstrapped above (qwen3:1.7b).
          # Leave OLLAMA_HOST/OLLAMA_MODEL unset to accept those auto-defaults,
          # or set the OLLAMA_MODEL repo variable to override (e.g. gemma3:4b).
          OLLAMA_ENABLED: ${{ vars.OLLAMA_ENABLED || 'true' }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
        run: node scripts/rename_auto.js

      - name: 💾 Commit renamed files + progress manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/img/renamed 2>/dev/null || true
          [ -f .cert-manifest.json ] && git add .cert-manifest.json || true
          git diff --cached --quiet || git commit -m "🤖 Auto-renamed certificates via Gemini -> Ollama -> DeepSeek"
          git push || echo "Nothing to push"

      # Pages deployment is handled by deploy.yml, which fires on every
      # push to master (including the commit above), so no separate
      # gh-pages deploy step is needed here.
