name: Auto Rename Certificates

on:
  push:
    paths:
      - 'public/img/certificates/**'
      - 'scripts/rename_auto.js'
      - '.github/workflows/rename_certificates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🧶 Ensure @google/genai is installed (recent version with httpOptions)
        run: bun add @google/genai --ignore-scripts

      - name: 🔐 Run rename script (Gemini 2.5 Flash-Lite + DeepSeek fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Primary vision model (image-capable, cheapest/fastest).
          GEMINI_MODEL: 'gemini-2.5-flash-lite'
          GEMINI_CONCURRENCY: '3'
          GEMINI_PASSES: '3'
          GEMINI_MAX_RETRIES: '6'
          GEMINI_TIMEOUT_MS: '90000'
          # DeepSeek fallback for files Gemini could not finish (text-only,
          # labels from filename). Optional but recommended.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: 'deepseek-v4-flash'  # cheapest; thinking disabled in script
        run: node scripts/rename_auto.js

      - name: 💾 Commit renamed files + progress manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/img/renamed 2>/dev/null || true
          [ -f .cert-manifest.json ] && git add .cert-manifest.json || true
          git diff --cached --quiet || git commit -m "🤖 Auto-renamed certificates via Gemini"
          git push || echo "Nothing to push"

      # Pages deployment is handled by deploy.yml, which fires on every
      # push to master (including the commit above), so no separate
      # gh-pages deploy step is needed here.
