name: Auto Rename Certificates

on:
  push:
    paths:
      - 'public/img/certificates/**'
      - 'scripts/rename_auto.js'
      - '.github/workflows/rename_certificates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🧶 Ensure @google/genai is installed (recent version with httpOptions)
        run: bun add @google/genai --ignore-scripts

      - name: 🧶 Ensure ollama SDK is installed (Ollama Cloud fallback)
        run: bun add ollama --ignore-scripts

      - name: 🔐 Run rename script (Gemini -> Ollama -> DeepSeek -> heuristic)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Primary vision model (image-capable, cheapest/fastest).
          GEMINI_MODEL: 'gemini-2.5-flash-lite'
          GEMINI_CONCURRENCY: '3'
          # Per-image cascade: each model is retried this many times before
          # falling through to the next (Google -> Ollama -> DeepSeek -> heuristic).
          GEMINI_MAX_RETRIES: '10'
          GEMINI_TIMEOUT_MS: '90000'
          # Ollama retry budget (per image).
          OLLAMA_MAX_RETRIES: '10'
          # DeepSeek = final API fallback (per-image retries).
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: 'deepseek-v4-flash'  # cheapest; thinking disabled in script
          DEEPSEEK_MAX_RETRIES: '10'
          # Ollama fallback (tried before DeepSeek). In CI, Ollama Cloud is used
          # when OLLAMA_API_KEY is set (https://ollama.com, model gemma3:4b);
          # otherwise the Ollama stage self-skips and the cascade goes to DeepSeek.
          # (Local Ollama still works if you run `ollama serve` yourself and leave
          # the key unset.) OLLAMA_HOST/OLLAMA_MODEL override the auto-defaults.
          OLLAMA_ENABLED: ${{ vars.OLLAMA_ENABLED || 'true' }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
        run: node scripts/rename_auto.js

      - name: 💾 Commit renamed files + progress manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/img/renamed 2>/dev/null || true
          [ -f .cert-manifest.json ] && git add .cert-manifest.json || true
          git diff --cached --quiet || git commit -m "🤖 Auto-renamed certificates via Gemini -> Ollama -> DeepSeek"
          git push || echo "Nothing to push"

      # Pages deployment is handled by deploy.yml, which fires on every
      # push to master (including the commit above), so no separate
      # gh-pages deploy step is needed here.
